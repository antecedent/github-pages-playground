name: Generate GitHub Pages

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  generate-pages:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RELEASE_NAME: ${{ github.event.release.name }}
      RELEASE_BODY: ${{ github.event.release.body }}
      RELEASE_URL: ${{ github.event.release.html_url }}
      RELEASE_PUBLISHED_AT: ${{ github.event.release.published_at }}
      RELEASE_TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Generate docs/pages
        run: php docs/tools/generate-pages.php

      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/pages

          if git diff --cached --quiet -- docs/pages; then
            echo "No generated page changes to commit."
            exit 0
          fi

          git commit -m "docs: update generated pages for ${RELEASE_TAG}"
          git push origin HEAD:${DEFAULT_BRANCH}
